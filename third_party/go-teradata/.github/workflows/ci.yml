name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.26'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Just
        uses: extractions/setup-just@v3

      - name: Run CI gate
        run: just ci
