syntax = "proto3";

package loom.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/teradata-labs/loom/gen/go/loom/v1;loomv1";

// The household: the people who use one server (a family sharing an
// assistant on their computer), their names, and short notes they send each
// other ("I'm running late", "Can you do pickup Thursday?"). Enabled with
// server.household.enabled. Every request acts as the caller's user ID: a
// person reads the notes they sent and the notes sent to them, nothing else.
// See docs/reference/household.md.

// HouseholdMember is one person on the server.
message HouseholdMember {
  // User ID (as given to `looms pair --user`).
  string user_id = 1;
  // Display name ("Sam"); the user ID when no name was given.
  string name = 2;
  // True for the caller.
  bool is_you = 3;
}

message ListHouseholdMembersRequest {}

message ListHouseholdMembersResponse {
  // Everyone in the household, by name.
  repeated HouseholdMember members = 1;
}

// HouseholdNoteKind says whether a note expects an answer.
enum HouseholdNoteKind {
  HOUSEHOLD_NOTE_KIND_UNSPECIFIED = 0;
  // Passes something on ("I'm running late"); no answer expected.
  HOUSEHOLD_NOTE_KIND_TELL = 1;
  // Asks something ("Can you do pickup Thursday?"); the recipient can answer
  // once with AnswerHouseholdNote.
  HOUSEHOLD_NOTE_KIND_ASK = 2;
}

// HouseholdNote is a note from one person to another, with its answer.
message HouseholdNote {
  string id = 1;
  string from_user_id = 2;
  // Sender's display name.
  string from_name = 3;
  string to_user_id = 4;
  // Recipient's display name.
  string to_name = 5;
  HouseholdNoteKind kind = 6;
  // What the sender wrote (at most 1000 characters).
  string text = 7;
  google.protobuf.Timestamp created_at = 8;
  // When the recipient read it; unset while unread.
  google.protobuf.Timestamp read_at = 9;
  // The recipient's answer to an ask; empty until answered.
  string answer = 10;
  google.protobuf.Timestamp answered_at = 11;
  // When the sender saw the answer; unset while the answer is new.
  google.protobuf.Timestamp answer_seen_at = 12;
  // True when the caller sent the note.
  bool from_you = 13;
}

message SendHouseholdNoteRequest {
  // Recipient's user ID: another member of the household.
  string to_user_id = 1;
  HouseholdNoteKind kind = 2;
  string text = 3;
}

message ListHouseholdNotesRequest {
  // Maximum notes to return, newest first (default 50, maximum 200).
  int32 limit = 1;
}

message ListHouseholdNotesResponse {
  // Notes the caller sent or received, newest first.
  repeated HouseholdNote notes = 1;
}

message AnswerHouseholdNoteRequest {
  // An ask sent to the caller, not yet answered.
  string note_id = 1;
  // The answer (at most 1000 characters).
  string text = 2;
}

message MarkHouseholdNotesReadRequest {
  // Notes to mark: a note sent to the caller is marked read; an answered
  // ask the caller sent has its answer marked seen. Empty marks all of them.
  repeated string note_ids = 1;
}

message MarkHouseholdNotesReadResponse {
  // How many notes changed.
  int32 marked = 1;
}

message GetHouseholdUpdatesRequest {}

// HouseholdUpdates is what is new for the caller, for a badge.
message HouseholdUpdates {
  // Notes sent to the caller that they have not read.
  int32 unread_notes = 1;
  // Asks sent to the caller that they have not answered.
  int32 unanswered_asks = 2;
  // Answers to the caller's asks that they have not seen.
  int32 new_answers = 3;
  // When anything the caller can see last changed; unset when nothing has.
  google.protobuf.Timestamp updated_at = 4;
  // The caller's open items due today or overdue (see HouseholdItem.yours).
  int32 items_due = 5;
}

// ---- Who's doing what ----
//
// Household items are chores, turns, pickups and appointments. An item is
// visible to the person who set it up, its assignees, the person it is for,
// and everyone in the household when `everyone` is set. Only the people it
// involves (creator, assignees, for_user) may change or delete it.

// HouseholdItemKind is what sort of thing an item is.
enum HouseholdItemKind {
  HOUSEHOLD_ITEM_KIND_UNSPECIFIED = 0;
  // Something to do ("take out the bins"), once or repeating.
  HOUSEHOLD_ITEM_KIND_CHORE = 1;
  // Something the assignees take turns at ("dishes"); completing it passes
  // the turn to the next assignee. Needs at least two assignees.
  HOUSEHOLD_ITEM_KIND_TURN = 2;
  // A pickup or drop-off: who, when, where.
  HOUSEHOLD_ITEM_KIND_PICKUP = 3;
  // An appointment: who it is for (for_user_id), who is taking them
  // (assignees), when, where.
  HOUSEHOLD_ITEM_KIND_APPOINTMENT = 4;
}

// HouseholdRepeat says when an item comes back. Unset or empty: once.
message HouseholdRepeat {
  // Every day.
  bool daily = 1;
  // Days of the week, 1 = Monday ... 7 = Sunday (ISO 8601). Ignored when
  // daily is set.
  repeated int32 weekdays = 2;
}

// HouseholdItem is one chore, turn, pickup or appointment.
message HouseholdItem {
  // Empty when creating.
  string id = 1;
  HouseholdItemKind kind = 2;
  // What it is ("Dishes"), at most 200 characters.
  string title = 3;
  // Who does it, as user IDs; for a turn, in turn order.
  repeated string assignees = 4;
  // Who the assignees are, by name, in the same order. Output only.
  repeated string assignee_names = 5;
  // Who it is for (an appointment's patient); optional.
  string for_user_id = 6;
  // for_user_id's name. Output only.
  string for_name = 7;
  // Visible to everyone in the household, not only the people it involves.
  bool everyone = 8;
  // When it is due (the next time, for a repeating item). A repeating item
  // without one starts on its next day, at midnight server time.
  google.protobuf.Timestamp starts_at = 9;
  HouseholdRepeat repeat = 10;
  // Where (at most 200 characters).
  string place = 11;
  // Anything else (at most 1000 characters).
  string notes = 12;
  // Output only from here on.
  // Who set it up.
  string created_by = 13;
  string created_by_name = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // For a turn: whose turn it is now, and whose it is next.
  string turn_user_id = 17;
  string turn_name = 18;
  string next_turn_user_id = 19;
  string next_turn_name = 20;
  // Who last marked it done, and when.
  string done_by = 21;
  string done_by_name = 22;
  google.protobuf.Timestamp done_at = 23;
  // True once a one-time item is done; a repeating item never is.
  bool done = 24;
  // True when it is the caller's to do: for a turn, when it is their turn;
  // otherwise when they are an assignee, or, for an item with no assignees,
  // when it involves them or is for everyone.
  bool yours = 25;
  // True when the caller may change or delete it.
  bool can_edit = 26;
}

message ListHouseholdItemsRequest {
  // Only items that are the caller's to do (HouseholdItem.yours).
  bool mine_only = 1;
  // Include one-time items already done.
  bool include_done = 2;
  // Only items due in [from, to); items with no time are always included.
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message ListHouseholdItemsResponse {
  // Soonest first; items with no time last.
  repeated HouseholdItem items = 1;
}

message SaveHouseholdItemRequest {
  // The item; with an id, replaces that item's kind, title, assignees,
  // for_user_id, everyone, starts_at, repeat, place and notes.
  HouseholdItem item = 1;
}

message CompleteHouseholdItemRequest {
  string item_id = 1;
}

message DeleteHouseholdItemRequest {
  string item_id = 1;
}

message DeleteHouseholdItemResponse {}
